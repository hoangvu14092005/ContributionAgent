name: PR6 Cleanup

on:
  push:
    branches: [agent/fix-pr5-control-plane-blockers]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-pr5-control-plane-blockers
      - name: Remove temporary PR6 validation scaffolding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')
          text = text.replace(
              'branches: [main, agent/fix-pr5-control-plane-blockers]',
              'branches: [main]',
              1,
          )
          ci.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/pr6-final-validation.yml
          rm -f .github/workflows/pr6-permit-migration.yml
          rm -f .github/workflows/pr6-web-hardening.yml
          rm -f .github/workflows/pr6-storage-flake-fix.yml
          rm -f .github/workflows/pr6-cleanup.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: remove temporary PR #6 validation scaffolding"
          git push origin HEAD:agent/fix-pr5-control-plane-blockers
