name: PR6 Permit Migration

on:
  push:
    branches: [agent/fix-pr5-control-plane-blockers]

permissions:
  contents: write

jobs:
  migrate-permits:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-pr5-control-plane-blockers
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Patch durable permit proof schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f"missing snippet in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          storage = Path("contribai/storage/work_items.py")
          text = storage.read_text(encoding="utf-8")
          marker = '''MIGRATIONS: Final[tuple[tuple[int, str, tuple[str, ...]], ...]] = (\n    (1, "contribution_control_plane", _CONTROL_PLANE_V1),\n)\n'''
          replacement = '''_PUBLISH_PERMIT_PROOF_BINDINGS_V2: Final[tuple[str, ...]] = (\n    "ALTER TABLE publish_permits ADD COLUMN base_sha TEXT",\n    "ALTER TABLE publish_permits ADD COLUMN verification_id TEXT",\n    "ALTER TABLE publish_permits ADD COLUMN quota_reservation_id TEXT",\n)\n\nMIGRATIONS: Final[tuple[tuple[int, str, tuple[str, ...]], ...]] = (\n    (1, "contribution_control_plane", _CONTROL_PLANE_V1),\n    (2, "publish_permit_proof_bindings", _PUBLISH_PERMIT_PROOF_BINDINGS_V2),\n)\n'''
          if "publish_permit_proof_bindings" not in text:
              if marker not in text:
                  raise RuntimeError("migration marker missing")
              storage.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

          replace_once(
              "contribai/control/command_service.py",
              '''                SELECT patch_hash, approved_side_effects_json, expires_at\n                FROM publish_permits WHERE id = ?\n''',
              '''                SELECT patch_hash, approved_side_effects_json, expires_at,\n                       base_sha, verification_id, quota_reservation_id\n                FROM publish_permits WHERE id = ?\n''',
          )
          replace_once(
              "contribai/control/command_service.py",
              '''                    or _aware(datetime.fromisoformat(str(existing[2]))) != expiry\n                ):\n''',
              '''                    or _aware(datetime.fromisoformat(str(existing[2]))) != expiry\n                    or str(existing[3] or "") != base_sha\n                    or str(existing[4] or "") != verification_id\n                    or str(existing[5] or "") != quota_reservation_id\n                ):\n''',
          )
          replace_once(
              "contribai/control/command_service.py",
              '''                INSERT INTO publish_permits\n                    (id, work_item_id, review_request_id, patch_hash,\n                     approved_side_effects_json, expires_at, consumed_at, created_at)\n                VALUES (?, ?, ?, ?, ?, ?, NULL, ?)\n''',
              '''                INSERT INTO publish_permits\n                    (id, work_item_id, review_request_id, patch_hash, base_sha,\n                     verification_id, quota_reservation_id, approved_side_effects_json,\n                     expires_at, consumed_at, created_at)\n                VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, NULL, ?)\n''',
          )
          replace_once(
              "contribai/control/command_service.py",
              '''                    review_id,\n                    patch_sha256,\n                    json.dumps(sorted(effect.value for effect in effects)),\n                    expiry.isoformat(),\n                    datetime.now(UTC).isoformat(),\n''',
              '''                    review_id,\n                    patch_sha256,\n                    base_sha,\n                    verification_id,\n                    quota_reservation_id,\n                    json.dumps(sorted(effect.value for effect in effects)),\n                    expiry.isoformat(),\n                    datetime.now(UTC).isoformat(),\n''',
          )

          integration = Path("tests/integration/test_entrypoints_control_plane.py")
          tests = integration.read_text(encoding="utf-8")
          old = '''    cursor = await memory.connection.execute("SELECT COUNT(*) FROM publish_permits")\n    assert (await cursor.fetchone())[0] == 1\n'''
          new = '''    cursor = await memory.connection.execute("SELECT COUNT(*) FROM publish_permits")\n    assert (await cursor.fetchone())[0] == 1\n    cursor = await memory.connection.execute(\n        """\n        SELECT base_sha, verification_id, quota_reservation_id\n        FROM publish_permits WHERE work_item_id = ?\n        """,\n        (item.id,),\n    )\n    assert await cursor.fetchone() == ("base-12", verification_id, quota_id)\n'''
          if new not in tests:
              if old not in tests:
                  raise RuntimeError("permit assertion marker missing")
              integration.write_text(tests.replace(old, new, 1), encoding="utf-8")

          storage_test = Path("tests/storage/test_work_items.py")
          tests = storage_test.read_text(encoding="utf-8")
          tests = tests.replace(
              "assert await cursor.fetchall() == [(1, 1)]",
              "assert await cursor.fetchall() == [(1, 1), (2, 1)]",
          )
          extra = '''\n\n@pytest.mark.asyncio\nasync def test_v1_database_migrates_publish_permit_proof_columns(tmp_path: Path) -> None:\n    db_path = tmp_path / "v1.db"\n    connection = await aiosqlite.connect(db_path)\n    try:\n        await connection.execute(\n            "CREATE TABLE schema_migrations (version INTEGER PRIMARY KEY, "\n            "name TEXT NOT NULL, applied_at TEXT NOT NULL)"\n        )\n        await connection.execute(\n            """\n            CREATE TABLE publish_permits (\n                id TEXT PRIMARY KEY, work_item_id TEXT NOT NULL,\n                review_request_id TEXT, patch_hash TEXT NOT NULL,\n                approved_side_effects_json TEXT NOT NULL DEFAULT '[]',\n                expires_at TEXT NOT NULL, consumed_at TEXT, created_at TEXT NOT NULL\n            )\n            """\n        )\n        await connection.execute(\n            "INSERT INTO schema_migrations VALUES (1, 'contribution_control_plane', 'now')"\n        )\n        await connection.commit()\n        await migrate_work_item_schema(connection)\n        cursor = await connection.execute("PRAGMA table_info(publish_permits)")\n        columns = {row[1] for row in await cursor.fetchall()}\n        assert {"base_sha", "verification_id", "quota_reservation_id"} <= columns\n        cursor = await connection.execute(\n            "SELECT name FROM schema_migrations WHERE version = 2"\n        )\n        assert await cursor.fetchone() == ("publish_permit_proof_bindings",)\n    finally:\n        await connection.close()\n'''
          if "test_v1_database_migrates_publish_permit_proof_columns" not in tests:
              tests += extra
          storage_test.write_text(tests, encoding="utf-8")
          PY
      - name: Validate permit migration
        run: |
          pip install -e ".[dev,mcp]"
          ruff format contribai/storage/work_items.py contribai/control/command_service.py tests/storage/test_work_items.py tests/integration/test_entrypoints_control_plane.py
          ruff check contribai/storage/work_items.py contribai/control/command_service.py
          pytest -q tests/storage/test_work_items.py tests/integration/test_entrypoints_control_plane.py tests/unit/test_publishing_idempotency.py
          python -m compileall -q contribai/storage contribai/control
      - name: Commit permit migration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contribai/storage/work_items.py contribai/control/command_service.py tests/storage/test_work_items.py tests/integration/test_entrypoints_control_plane.py
          git commit -m "fix: persist complete publish permit proofs"
          git push origin HEAD:agent/fix-pr5-control-plane-blockers
