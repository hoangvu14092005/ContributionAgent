name: CI

on:
  push:
    branches: [main, agent/fix-pr5-control-plane-blockers]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply temporary PR #6 fixups
        run: python .github/pr6_fixup.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        shell: bash
        run: set -o pipefail; ruff check contribai/ 2>&1 | tee lint.log
      - name: Format check
        shell: bash
        run: set -o pipefail; ruff format --check contribai/ tests/ 2>&1 | tee format.log
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-diagnostics
          path: |
            lint.log
            format.log
          if-no-files-found: ignore
      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-snapshot
          path: |
            contribai
            tests
            pyproject.toml
          include-hidden-files: true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Apply temporary PR #6 fixups
        run: python .github/pr6_fixup.py
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"
      - name: Run tests
        shell: bash
        run: >-
          set -o pipefail;
          pytest tests/ -v --tb=short --cov=contribai --cov-report=term-missing
          --cov-fail-under=50 2>&1 | tee pytest-${{ matrix.python-version }}.log
      - name: Compile package
        shell: bash
        run: set -o pipefail; python -m compileall -q contribai 2>&1 | tee compile-${{ matrix.python-version }}.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.python-version }}
          path: |
            pytest-${{ matrix.python-version }}.log
            compile-${{ matrix.python-version }}.log
          if-no-files-found: ignore

  architecture-safety:
    name: Architecture & Safety Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply temporary PR #6 fixups
        run: python .github/pr6_fixup.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"
      - name: Run control-plane contracts
        shell: bash
        run: >-
          set -o pipefail;
          pytest -q tests/architecture tests/safety tests/execution
          tests/engines/contracts tests/engines/adapters
          tests/integration/test_entrypoints_control_plane.py
          2>&1 | tee architecture-safety.log
      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-safety-diagnostics
          path: architecture-safety.log
          if-no-files-found: ignore

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply temporary PR #6 fixups
        run: python .github/pr6_fixup.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e ".[dev]" pip-audit
      - name: Audit dependencies
        run: pip-audit --ignore-vuln CVE-2026-4539  # pygments transitive dep, no fix available yet

  persist-fixups:
    name: Persist validated fixups
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/fix-pr5-control-plane-blockers'
    needs: [lint, test, architecture-safety, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-pr5-control-plane-blockers
      - name: Apply temporary PR #6 fixups
        run: python .github/pr6_fixup.py
      - name: Commit fixups
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No fixups to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contribai tests/architecture/test_publish_gate.py
          git commit -m "fix: apply validated PR #6 corrections"
          git push origin HEAD:agent/fix-pr5-control-plane-blockers
